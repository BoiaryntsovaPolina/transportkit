[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transportkit"
version = "1.0.0"
description = "Бібліотека для розв'язання транспортних задач: методи опорного плану та метод потенціалів"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Boyaryntsova P. S." }]
keywords = ["transportation problem", "operations research", "vogel", "potentials", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/BoiaryntsovaPolina/transportkit"

[tool.setuptools.packages.find]
where = ["src"]
